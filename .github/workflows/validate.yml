name: Validate blueprint

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ansible-core shellcheck yamllint python3-yaml
          mkdir -p "$RUNNER_TEMP/bin"
          GOBIN="$RUNNER_TEMP/bin" go install github.com/zricethezav/gitleaks/v8@v8.29.1
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Validate repository
        env:
          HOMELAB_STRICT_VALIDATION: "1"
        run: scripts/validate-repository.sh

      - name: Prove transactional rollback in disposable Lab
        env:
          HOMELAB_LAB_ROLLBACK_TEST: "1"
        run: tests/test-lab-rollback.sh

      - name: Scan complete Git history for secrets
        run: gitleaks git . --redact --no-banner --config .gitleaks.toml
