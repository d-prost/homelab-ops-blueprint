---
name: Graphify architecture pilot v2

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/graphify-pilot-v2.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: graphify-pilot-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pilot:
    name: Qwen raw vs segmented Ansible pilot
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GRAPHIFY_VERSION: "0.9.28"
      OLLAMA_MODEL: "qwen2.5-coder:7b"
      OLLAMA_BASE_URL: "http://127.0.0.1:11434/v1"
      OLLAMA_API_KEY: "local"
      GRAPHIFY_OLLAMA_NUM_CTX: "16384"
      GRAPHIFY_MAX_OUTPUT_TOKENS: "12000"
      GRAPHIFY_QUERY_LOG_DISABLE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare evidence directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/graphify-v2-evidence"
          {
            echo "repository_commit=$(git rev-parse HEAD)"
            echo "graphify_version=$GRAPHIFY_VERSION"
            echo "semantic_backend=ollama-local"
            echo "model=$OLLAMA_MODEL"
            echo "context=$GRAPHIFY_OLLAMA_NUM_CTX"
            echo "max_output_tokens=$GRAPHIFY_MAX_OUTPUT_TOKENS"
            echo "token_budget=1200"
            echo "mode=normal"
          } > "$RUNNER_TEMP/graphify-v2-evidence/environment.txt"

      - name: Install pinned Graphify
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/graphify-v2-venv"
          "$RUNNER_TEMP/graphify-v2-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/graphify-v2-venv/bin/pip" install "graphifyy[ollama]==$GRAPHIFY_VERSION"
          "$RUNNER_TEMP/graphify-v2-venv/bin/graphify" --version | tee -a "$RUNNER_TEMP/graphify-v2-evidence/environment.txt"

      - name: Install and start Ollama with Qwen2.5-Coder 7B
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --location https://ollama.com/install.sh -o "$RUNNER_TEMP/install-ollama.sh"
          bash "$RUNNER_TEMP/install-ollama.sh"
          nohup ollama serve > "$RUNNER_TEMP/graphify-v2-evidence/ollama-serve.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null 2>&1 && break
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull "$OLLAMA_MODEL" | tee "$RUNNER_TEMP/graphify-v2-evidence/ollama-pull.log"
          ollama show "$OLLAMA_MODEL" | tee "$RUNNER_TEMP/graphify-v2-evidence/ollama-model.txt"

      - name: Build raw and segmented implementation corpora
        shell: bash
        run: |
          set -euo pipefail
          raw="$RUNNER_TEMP/corpus-raw"
          split="$RUNNER_TEMP/corpus-segmented"
          rm -rf "$raw" "$split"
          mkdir -p "$raw" "$split"

          files=(
            scripts/deploy-stack.sh
            scripts/assert-ansible-hosts.sh
            scripts/verify-compose-health.py
            ansible/playbooks/preflight.yml
            ansible/playbooks/deploy-stack.yml
            ansible/roles/managed_stack/tasks/main.yml
            ansible/group_vars/all.yml
            stacks/dozzle/stack.yml
            stacks/dozzle/compose.yaml
          )

          for file in "${files[@]}"; do
            mkdir -p "$raw/$(dirname "$file")" "$split/$(dirname "$file")"
            cp -- "$file" "$raw/$file"
            if [[ "$file" != "ansible/roles/managed_stack/tasks/main.yml" ]]; then
              cp -- "$file" "$split/$file"
            fi
          done

          python3 - "$PWD/ansible/roles/managed_stack/tasks/main.yml" "$split/ansible/roles/managed_stack/tasks" <<'PY'
          from pathlib import Path
          import sys

          src = Path(sys.argv[1])
          out = Path(sys.argv[2])
          out.mkdir(parents=True, exist_ok=True)
          lines = src.read_text(encoding="utf-8").splitlines(keepends=True)

          transaction = next(i for i, line in enumerate(lines) if line.startswith("- name: Validate and deploy candidate transaction"))
          rescue = next(i for i in range(transaction, len(lines)) if lines[i].startswith("  rescue:"))
          always = next(i for i in range(rescue, len(lines)) if lines[i].startswith("  always:"))

          (out / "main__01-prelude.yml").write_text("".join(lines[:transaction]), encoding="utf-8")
          (out / "main__02-candidate.yml").write_text("".join(lines[transaction:rescue]), encoding="utf-8")

          def dedent_two(part):
              return "".join(line[2:] if line.startswith("  ") else line for line in part)

          (out / "main__03-rescue.yml").write_text(dedent_two(lines[rescue:always]), encoding="utf-8")
          (out / "main__04-always.yml").write_text(dedent_two(lines[always:]), encoding="utf-8")
          PY

          original_sha="$(sha256sum ansible/roles/managed_stack/tasks/main.yml | awk '{print $1}')"
          reconstructed_sha="$({
            cat "$split/ansible/roles/managed_stack/tasks/main__01-prelude.yml"
            cat "$split/ansible/roles/managed_stack/tasks/main__02-candidate.yml"
            sed 's/^/  /' "$split/ansible/roles/managed_stack/tasks/main__03-rescue.yml"
            sed 's/^/  /' "$split/ansible/roles/managed_stack/tasks/main__04-always.yml"
          } | sha256sum | awk '{print $1}')"
          printf 'original_sha256=%s\nreconstructed_sha256=%s\n' "$original_sha" "$reconstructed_sha" > "$RUNNER_TEMP/graphify-v2-evidence/segmentation-integrity.txt"
          [[ "$original_sha" == "$reconstructed_sha" ]]

          {
            echo "# raw corpus"
            find "$raw" -type f -printf '%P\n' | sort
            echo
            echo "# segmented corpus"
            find "$split" -type f -printf '%P\n' | sort
          } > "$RUNNER_TEMP/graphify-v2-evidence/corpora.txt"
          wc -l ansible/roles/managed_stack/tasks/main.yml "$split"/ansible/roles/managed_stack/tasks/main__*.yml > "$RUNNER_TEMP/graphify-v2-evidence/segmentation-line-counts.txt"

      - name: Write architecture scorer
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/score_graphify_v2.py" <<'PY'
          import json
          import re
          import sys
          from collections import defaultdict, deque
          from pathlib import Path

          variant = sys.argv[1]
          graph_path = Path(sys.argv[2])
          out_dir = Path(sys.argv[3])
          out_dir.mkdir(parents=True, exist_ok=True)

          if not graph_path.exists():
              result = {"variant": variant, "graph_present": False, "score": 0, "total": 15, "tests": []}
              (out_dir / f"{variant}-score.json").write_text(json.dumps(result, indent=2), encoding="utf-8")
              raise SystemExit(0)

          data = json.loads(graph_path.read_text(encoding="utf-8"))
          nodes = data.get("nodes", [])
          edges = data.get("edges", data.get("links", []))
          by_id = {str(n.get("id")): n for n in nodes}

          def source(nid): return str(by_id.get(nid, {}).get("source_file", ""))
          def label(nid): return str(by_id.get(nid, {}).get("label", nid))

          graph = defaultdict(list)
          for e in edges:
              s, t = str(e.get("source")), str(e.get("target"))
              if s in by_id and t in by_id:
                  graph[s].append((t, e)); graph[t].append((s, e))

          def source_nodes(pattern):
              rx = re.compile(pattern)
              return {nid for nid in by_id if rx.search(source(nid))}

          def label_nodes(pattern, source_pattern=None):
              rx = re.compile(pattern, re.I)
              srx = re.compile(source_pattern) if source_pattern else None
              return {nid for nid in by_id if rx.search(label(nid)) and (srx is None or srx.search(source(nid)))}

          def shortest(starts, goals, max_hops=5):
              starts, goals = set(starts), set(goals)
              if not starts or not goals: return None
              queue = deque((s, [s], []) for s in starts)
              seen = set(starts)
              while queue:
                  cur, path, pedges = queue.popleft()
                  if cur in goals and len(path) > 1: return path, pedges
                  if len(path) - 1 >= max_hops: continue
                  for nxt, edge in graph.get(cur, []):
                      if nxt not in seen:
                          seen.add(nxt)
                          queue.append((nxt, path + [nxt], pedges + [edge]))
              return None

          role_src = r"ansible/roles/managed_stack/tasks/main(?:__[^/]*)?\.yml$"
          tests = []

          def presence(tid, desc, ids):
              ids = sorted(ids)
              tests.append({"id": tid, "description": desc, "pass": bool(ids), "nodes": [f"{label(n)} [{source(n)}]" for n in ids[:12]]})

          def path_test(tid, desc, starts, goals, hops=5):
              found = shortest(starts, goals, hops)
              item = {"id": tid, "description": desc, "pass": bool(found)}
              if found:
                  path, pedges = found
                  item["path"] = [f"{label(n)} [{source(n)}]" for n in path]
                  item["relations"] = [e.get("relation") for e in pedges]
                  item["confidences"] = [e.get("confidence") for e in pedges]
              tests.append(item)

          path_test("G1", "deploy-stack.sh -> preflight.yml", source_nodes(r"scripts/deploy-stack\.sh$"), source_nodes(r"ansible/playbooks/preflight\.yml$"), 4)
          path_test("G2", "deploy-stack.sh -> deploy-stack.yml", source_nodes(r"scripts/deploy-stack\.sh$"), source_nodes(r"ansible/playbooks/deploy-stack\.yml$"), 4)
          path_test("G3", "deploy-stack.yml -> real stacks/dozzle/stack.yml", source_nodes(r"ansible/playbooks/deploy-stack\.yml$"), source_nodes(r"stacks/dozzle/stack\.yml$"), 4)
          path_test("G4", "deploy-stack.yml -> managed_stack implementation", source_nodes(r"ansible/playbooks/deploy-stack\.yml$"), source_nodes(role_src), 4)
          presence("G5", "managed_stack source has nodes", source_nodes(role_src))
          presence("G6", "candidate functional verification task", label_nodes(r"functional stack verification|run functional.*verification", role_src))
          path_test("G7", "managed_stack -> verify-compose-health.py", source_nodes(role_src), source_nodes(r"scripts/verify-compose-health\.py$"), 5)
          presence("G8", "deployment record task", label_nodes(r"record deployed git commit|deployment record", role_src))
          presence("G9", "restore prior managed files task", label_nodes(r"restore prior managed files", role_src))
          presence("G10", "remove candidate-only files task", label_nodes(r"remove files introduced only by failed candidate|candidate-only", role_src))
          presence("G11", "reapply prior Compose task", label_nodes(r"reapply prior compose", role_src))
          presence("G12", "verify restored prior release task", label_nodes(r"verify restored prior release", role_src))
          path_test("G13", "functional verification -> deployment record", label_nodes(r"functional stack verification|run functional.*verification", role_src), label_nodes(r"record deployed git commit|deployment record", role_src), 4)
          path_test("G14", "restore prior files -> prior-release verification", label_nodes(r"restore prior managed files", role_src), label_nodes(r"verify restored prior release", role_src), 5)
          path_test("G15", "prior contract -> reapply prior Compose", label_nodes(r"load exact prior contract|prior contract", role_src), label_nodes(r"reapply prior compose", role_src), 5)

          per_source = defaultdict(int)
          for n in nodes: per_source[str(n.get("source_file", "<none>"))] += 1

          cross = []
          for e in edges:
              s, t = str(e.get("source")), str(e.get("target"))
              if s in by_id and t in by_id and source(s) and source(t) and source(s) != source(t):
                  cross.append({"source": f"{label(s)} [{source(s)}]", "target": f"{label(t)} [{source(t)}]", "relation": e.get("relation"), "confidence": e.get("confidence"), "origin": e.get("_origin")})

          result = {"variant": variant, "graph_present": True, "nodes": len(nodes), "edges": len(edges), "score": sum(t["pass"] for t in tests), "total": len(tests), "tests": tests, "nodes_per_source": dict(sorted(per_source.items())), "cross_source_edges": cross}
          (out_dir / f"{variant}-score.json").write_text(json.dumps(result, indent=2), encoding="utf-8")

          lines = [f"# {variant} score", "", f"Gold: {result['score']}/{result['total']}", f"Nodes: {len(nodes)}", f"Edges: {len(edges)}", f"Cross-source edges: {len(cross)}", "", "## Tests", ""]
          for t in tests:
              lines += [f"### {t['id']} - {'PASS' if t['pass'] else 'FAIL'}", t["description"]]
              if t.get("path"):
                  lines.append("- Path: " + " -> ".join(t["path"]))
                  lines.append("- Relations: " + repr(t.get("relations")))
                  lines.append("- Confidence: " + repr(t.get("confidences")))
              for n in t.get("nodes", []): lines.append("- Node: " + n)
              lines.append("")
          lines += ["## Nodes per source", ""] + [f"- `{k}`: {v}" for k, v in sorted(per_source.items())]
          lines += ["", "## Cross-source edges", ""] + [f"- {e['source']} --{e['relation']} [{e['confidence']}/{e['origin']}]--> {e['target']}" for e in cross]
          (out_dir / f"{variant}-score.md").write_text("\n".join(lines), encoding="utf-8")
          PY

      - name: Run raw corpus
        shell: bash
        run: |
          set +e
          pushd "$RUNNER_TEMP/corpus-raw" >/dev/null
          "$RUNNER_TEMP/graphify-v2-venv/bin/graphify" extract . \
            --backend ollama --model "$OLLAMA_MODEL" \
            --directed --no-cluster --no-viz \
            --token-budget 1200 --max-concurrency 1 --api-timeout 1200 --timing \
            > "$RUNNER_TEMP/graphify-v2-evidence/raw.log" 2>&1
          rc=$?
          echo "$rc" > "$RUNNER_TEMP/graphify-v2-evidence/raw.rc"
          if [[ -d graphify-out ]]; then
            mkdir -p "$RUNNER_TEMP/graphify-v2-evidence/raw"
            cp -a graphify-out/. "$RUNNER_TEMP/graphify-v2-evidence/raw/"
          fi
          popd >/dev/null
          exit 0

      - name: Score raw graph
        shell: bash
        run: python3 "$RUNNER_TEMP/score_graphify_v2.py" raw "$RUNNER_TEMP/graphify-v2-evidence/raw/graph.json" "$RUNNER_TEMP/graphify-v2-evidence"

      - name: Decide whether segmented diagnostic is needed
        id: decide
        shell: bash
        run: |
          python3 - "$RUNNER_TEMP/graphify-v2-evidence/raw-score.json" "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          from pathlib import Path
          d = json.loads(Path(sys.argv[1]).read_text())
          tests = {t["id"]: t["pass"] for t in d.get("tests", [])}
          critical = all(tests.get(k, False) for k in ("G1", "G2", "G4", "G5", "G6", "G7", "G13", "G14"))
          run_segmented = not (d.get("score", 0) >= 12 and critical)
          with open(sys.argv[2], "a", encoding="utf-8") as f:
              f.write(f"run_segmented={'true' if run_segmented else 'false'}\n")
          print(f"raw_score={d.get('score',0)}/{d.get('total',15)} critical={critical} run_segmented={run_segmented}")
          PY

      - name: Run segmented corpus when raw graph is insufficient
        if: steps.decide.outputs.run_segmented == 'true'
        shell: bash
        run: |
          set +e
          pushd "$RUNNER_TEMP/corpus-segmented" >/dev/null
          "$RUNNER_TEMP/graphify-v2-venv/bin/graphify" extract . \
            --backend ollama --model "$OLLAMA_MODEL" \
            --directed --no-cluster --no-viz \
            --token-budget 1200 --max-concurrency 1 --api-timeout 1200 --timing \
            > "$RUNNER_TEMP/graphify-v2-evidence/segmented.log" 2>&1
          rc=$?
          echo "$rc" > "$RUNNER_TEMP/graphify-v2-evidence/segmented.rc"
          if [[ -d graphify-out ]]; then
            mkdir -p "$RUNNER_TEMP/graphify-v2-evidence/segmented"
            cp -a graphify-out/. "$RUNNER_TEMP/graphify-v2-evidence/segmented/"
          fi
          popd >/dev/null
          exit 0

      - name: Score segmented graph
        if: steps.decide.outputs.run_segmented == 'true'
        shell: bash
        run: python3 "$RUNNER_TEMP/score_graphify_v2.py" segmented "$RUNNER_TEMP/graphify-v2-evidence/segmented/graph.json" "$RUNNER_TEMP/graphify-v2-evidence"

      - name: Run fixed graph queries
        shell: bash
        run: |
          set +e
          queries=(
            "How does deploy-stack.sh reach the deploy-stack.yml playbook and managed_stack role?"
            "Trace the candidate deployment from functional verification to the deployment record."
            "Trace rollback from restoring prior files through reapplying Compose to verifying the previous release."
            "How is verify-compose-health.py reached from the managed_stack role?"
          )
          for variant in raw segmented; do
            [[ -f "$RUNNER_TEMP/graphify-v2-evidence/$variant/graph.json" ]] || continue
            corpus="$RUNNER_TEMP/corpus-$variant"
            output="$RUNNER_TEMP/graphify-v2-evidence/$variant-queries.txt"
            : > "$output"
            pushd "$corpus" >/dev/null
            for q in "${queries[@]}"; do
              {
                echo "===== QUERY ====="; echo "$q"; echo "===== RESULT ====="
                "$RUNNER_TEMP/graphify-v2-venv/bin/graphify" query "$q" || true
                echo
              } >> "$output" 2>&1
            done
            popd >/dev/null
          done
          exit 0

      - name: Write comparative summary
        if: always()
        shell: bash
        run: |
          python3 - "$RUNNER_TEMP/graphify-v2-evidence" <<'PY'
          import json, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          rows = []
          for variant in ("raw", "segmented"):
              p = root / f"{variant}-score.json"
              if p.exists():
                  d = json.loads(p.read_text())
                  rows.append((variant, d.get("score", 0), d.get("total", 15), d.get("nodes", 0), d.get("edges", 0), len(d.get("cross_source_edges", []))))
          lines = ["# Graphify Pilot v2", "", "Graphify 0.9.28, Normal Mode, local Ollama Qwen2.5-Coder 7B.", "", "| Variant | Gold | Nodes | Edges | Cross-source edges |", "|---|---:|---:|---:|---:|"]
          for v, score, total, nodes, edges, cross in rows:
              lines.append(f"| {v} | {score}/{total} | {nodes} | {edges} | {cross} |")
          lines += ["", "Decision logic:", "- raw strong result => Graphify is viable without preprocessing.", "- raw weak + segmented strong => ingestion/chunking limitation; Graphify would require an Ansible adapter/workaround.", "- both weak => reject for this architecture use case."]
          text = "\n".join(lines) + "\n"
          (root / "PILOT_V2_SUMMARY.md").write_text(text, encoding="utf-8")
          print(text)
          PY
          cat "$RUNNER_TEMP/graphify-v2-evidence/PILOT_V2_SUMMARY.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload complete v2 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: graphify-pilot-v2-evidence
          path: ${{ runner.temp }}/graphify-v2-evidence
          if-no-files-found: error
          retention-days: 5

      - name: Fail only on extraction execution errors
        if: always()
        shell: bash
        run: |
          raw_rc="$(cat "$RUNNER_TEMP/graphify-v2-evidence/raw.rc" 2>/dev/null || echo 99)"
          [[ "$raw_rc" == "0" ]] || exit 1
          if [[ "${{ steps.decide.outputs.run_segmented }}" == "true" ]]; then
            segmented_rc="$(cat "$RUNNER_TEMP/graphify-v2-evidence/segmented.rc" 2>/dev/null || echo 99)"
            [[ "$segmented_rc" == "0" ]] || exit 1
          fi
