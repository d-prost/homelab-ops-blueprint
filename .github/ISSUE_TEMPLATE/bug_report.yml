---
name: Bug report
description: Reproducible problem in the project boundary.
title: "bug: "
body:
  - type: markdown
    attributes:
      value: Public reports stay free of credentials, private hostnames, addresses, URLs, secrets and recovery evidence.
  - type: textarea
    id: problem
    attributes:
      label: Observed behavior
      description: The smallest clear description of what happened.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: The behavior expected from the documented project contract.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Smallest command sequence or configuration needed to reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Relevant Docker, Compose, Ansible and OS versions.
  - type: textarea
    id: output
    attributes:
      label: Relevant output
      description: Non-sensitive validation output, logs or error messages.
