---
name: Bug report
description: Report a reproducible problem.
title: "bug: "
body:
  - type: markdown
    attributes:
      value: Please redact credentials and environment-specific details from logs or configuration before posting them.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the smallest set of steps or configuration needed to reproduce it.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Relevant Docker, Compose, Ansible and OS versions.
  - type: textarea
    id: output
    attributes:
      label: Relevant output
      description: Add validation output, logs or error messages if they help explain the problem.
