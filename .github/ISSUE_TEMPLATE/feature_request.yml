---
name: Feature request
description: Bounded improvement or new use case.
title: "feature: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem boundary
      description: The concrete limitation or unsupported use case.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed shape
      description: The smallest useful approach, including deliberate non-goals.
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Real operational need, reproducible limitation or other reason the added complexity is justified.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Relevant alternatives, constraints or compatibility considerations.
