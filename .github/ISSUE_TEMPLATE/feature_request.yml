---
name: Feature request
description: Suggest an improvement or new use case.
title: "feature: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that is awkward or not supported today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Idea
      description: Describe the approach you have in mind, if any.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add examples, alternatives or constraints that would help evaluate the request.
