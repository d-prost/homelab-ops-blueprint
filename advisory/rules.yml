schema_version: 1

rules:
  - id: persist-retry-state-before-mutation
    title: Persist retry state before mutation
    category: state-management
    status: advisory
    source: production-derived
    applies_when:
      - A change needs previous state or generated identifiers to retry or reverse a later mutation.
    principle: >-
      State required for a deterministic retry or cutback should exist before
      the first mutation that depends on it.
    recommendation: >-
      Persist and validate the minimum retry or cutback state before changing
      external or runtime state.
    proof:
      - >-
        Interrupt the operation after the first mutation and show that a clean
        rerun can make the same decision without reconstructing missing state.

  - id: acceptance-failure-needs-cutback
    title: Define cutback for post-change acceptance failures
    category: transaction-safety
    status: advisory
    source: production-derived
    applies_when:
      - A change mutates runtime state and then performs post-change acceptance checks.
    principle: >-
      A failed acceptance check should have an explicit bounded outcome rather
      than leave the runtime in an accidental intermediate state.
    recommendation: >-
      Prepare the previous accepted state before mutation and define how it is
      restored or otherwise reconciled when post-change acceptance fails.
    proof:
      - Inject a post-change verification failure after mutation.
      - Show that the documented cutback or reconciliation path reaches a known state.
      - Re-run the checks that prove the resulting state is functional.

  - id: one-content-authority
    title: Keep one content authority for a managed artifact
    category: ownership
    status: advisory
    source: production-derived
    applies_when:
      - The same managed file or unit could otherwise be copied or generated by more than one path.
    principle: >-
      A managed artifact should have one canonical content owner so maintenance
      cannot create two independent versions of the same desired state.
    recommendation: >-
      Keep the canonical content in one place and make other locations reference
      or install from that source instead of maintaining parallel copies.
    proof:
      - Change the canonical source and show that no second independently maintained copy can remain authoritative.

  - id: detach-unused-control-streams
    title: Detach control streams that a subprocess does not use
    category: automation-safety
    status: advisory
    source: production-derived
    applies_when:
      - A subprocess runs inside a heredoc, pipeline, or scripted control stream and is not meant to consume that input.
    principle: >-
      A helper process should not inherit a control stream it does not need,
      because reading it can silently consume commands intended for the caller.
    recommendation: >-
      Detach unused standard input explicitly and attach input only to commands
      that intentionally consume it.
    proof:
      - Run the operation with the same non-interactive control stream used in automation.
      - Show that every command after the helper still executes.
