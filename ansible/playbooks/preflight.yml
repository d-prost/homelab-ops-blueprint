---
- name: Validate a HomeLab stack without changing it
  hosts: all
  gather_facts: false
  become: true
  vars_files:
    - "{{ playbook_dir }}/../group_vars/all.yml"
  vars:
    stack_source_dir: "{{ homelab_release_root }}/stacks/{{ stack_name }}"

  pre_tasks:
    - name: Require a selected stack and explicit payload roots
      ansible.builtin.assert:
        that:
          - stack_name is defined
          - stack_name is match('^[a-z0-9][a-z0-9-]*$')
          - homelab_repo_root is defined
          - homelab_repo_root is match('^/.+')
          - homelab_release_root is defined
          - homelab_release_root is match('^/.+')
        fail_msg: Pass a safe stack name and absolute control-plane and payload roots.

    - name: Require explicit environment classification
      ansible.builtin.assert:
        that:
          - homelab_environment is defined
          - homelab_environment in ['production', 'lab']
          - homelab_expected_hostname is defined
          - homelab_expected_hostname | length > 0
        fail_msg: Inventory must declare environment and the exact expected hostname.

    - name: Read actual host name
      ansible.builtin.command:
        argv:
          - /bin/hostname
      register: homelab_actual_hostname
      changed_when: false
      check_mode: false

    - name: Refuse execution on an unexpected host
      ansible.builtin.assert:
        that:
          - homelab_actual_hostname.stdout == homelab_expected_hostname
        fail_msg: >-
          Refusing deployment because the actual hostname does not match the
          exact hostname declared by the selected inventory.

    - name: Load stack deployment contract
      ansible.builtin.include_vars:
        file: "{{ stack_source_dir }}/stack.yml"

  tasks:
    - name: Check Docker server access
      ansible.builtin.command:
        argv: "{{ homelab_clean_docker_argv + ['version'] }}"
      changed_when: false
      check_mode: false

    - name: Check Docker Compose access
      ansible.builtin.command:
        argv: "{{ homelab_clean_docker_argv + ['compose', 'version', '--short'] }}"
      changed_when: false
      check_mode: false

    - name: Render candidate image list
      # Compose rendering consumes only the release payload. Run it on the
      # control plane because a remote target must not require a Git checkout.
      ansible.builtin.command:
        argv: >-
          {{ homelab_clean_docker_argv +
             ['compose', '--env-file', stack_source_dir + '/defaults.env',
              '-f', stack_source_dir + '/compose.yaml', 'config', '--images'] }}
      delegate_to: localhost
      register: rendered_images
      changed_when: false
      check_mode: false

    - name: Refuse mutable or unpinned images
      ansible.builtin.assert:
        that:
          - rendered_images.stdout_lines | length > 0
          - >-
            rendered_images.stdout_lines
            | select('match', '^.+@sha256:[0-9a-f]{64}$')
            | list | length == rendered_images.stdout_lines | length
        fail_msg: Every managed image must use an immutable @sha256 digest.

    - name: Validate complete Compose model
      # This is payload validation, not a target Runtime check.
      ansible.builtin.command:
        argv: >-
          {{ homelab_clean_docker_argv +
             ['compose', '--env-file', stack_source_dir + '/defaults.env',
              '-f', stack_source_dir + '/compose.yaml', 'config', '--quiet'] }}
      delegate_to: localhost
      changed_when: false
      check_mode: false
      no_log: true
