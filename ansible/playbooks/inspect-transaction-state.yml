---
- name: Inspect durable transaction state without mutating the target
  hosts: all
  gather_facts: false
  become: true
  vars_files:
    - "{{ playbook_dir }}/../group_vars/all.yml"

  pre_tasks:
    - name: Require safe inspection metadata
      ansible.builtin.assert:
        that:
          - stack_name is defined
          - stack_name is match('^[a-z0-9][a-z0-9-]*$')
          - homelab_transaction_root is defined
          - homelab_transaction_root is match('^/.+')
        fail_msg: Safe stack and transaction-root metadata are required.

    - name: Verify target identity before reading transaction state
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/../tasks/verify-target-identity.yml"

  tasks:
    - name: Inspect unresolved marker
      ansible.builtin.stat:
        path: "{{ homelab_transaction_state_dir }}/{{ stack_name }}.unresolved"
      register: unresolved_marker_stat
      changed_when: false
      check_mode: false

    - name: Read unresolved marker
      ansible.builtin.slurp:
        src: "{{ homelab_transaction_state_dir }}/{{ stack_name }}.unresolved"
      register: unresolved_marker
      when: unresolved_marker_stat.stat.exists
      changed_when: false
      check_mode: false

    - name: Export unresolved marker to control transaction context
      ansible.builtin.copy:
        dest: "{{ homelab_transaction_root }}/observed.marker"
        mode: "0600"
        content: "{{ unresolved_marker.content | b64decode }}"
      delegate_to: localhost
      become: false
      when: unresolved_marker_stat.stat.exists
      changed_when: false
      check_mode: false

    - name: Inspect accepted record
      ansible.builtin.stat:
        path: "{{ homelab_deployment_record_dir }}/{{ stack_name }}.record"
      register: accepted_record_stat
      changed_when: false
      check_mode: false

    - name: Read accepted record
      ansible.builtin.slurp:
        src: "{{ homelab_deployment_record_dir }}/{{ stack_name }}.record"
      register: accepted_record
      when: accepted_record_stat.stat.exists
      changed_when: false
      check_mode: false

    - name: Export accepted record to control transaction context
      ansible.builtin.copy:
        dest: "{{ homelab_transaction_root }}/observed.record"
        mode: "0600"
        content: "{{ accepted_record.content | b64decode }}"
      delegate_to: localhost
      become: false
      when: accepted_record_stat.stat.exists
      changed_when: false
      check_mode: false

    - name: Inspect acceptance receipt
      ansible.builtin.stat:
        path: "{{ homelab_deployment_record_dir }}/{{ stack_name }}.receipt"
      register: acceptance_receipt_stat
      changed_when: false
      check_mode: false

    - name: Read acceptance receipt
      ansible.builtin.slurp:
        src: "{{ homelab_deployment_record_dir }}/{{ stack_name }}.receipt"
      register: acceptance_receipt
      when: acceptance_receipt_stat.stat.exists
      changed_when: false
      check_mode: false

    - name: Export acceptance receipt to control transaction context
      ansible.builtin.copy:
        dest: "{{ homelab_transaction_root }}/observed.receipt"
        mode: "0600"
        content: "{{ acceptance_receipt.content | b64decode }}"
      delegate_to: localhost
      become: false
      when: acceptance_receipt_stat.stat.exists
      changed_when: false
      check_mode: false
