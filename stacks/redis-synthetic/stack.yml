---
stack_target_dir: /opt/homelab-ops/stacks/redis-synthetic
stack_compose_dest: docker-compose.yml
stack_expected_services:
  - redis
stack_managed_files:
  - src: compose.yaml
    dest: docker-compose.yml
    mode: "0644"
  - src: defaults.env
    dest: defaults.env
    mode: "0644"
stack_functional_checks:
  - name: redis-ping
    service: redis
    protocol: redis-ping
    port: 6379
operations:
  services:
    redis:
      stateful: true
      persistent_mounts:
        - target: /data
      backup:
        policy: synthetic-rdb
      restore:
        runbook: recovery/README.md
        verification: redis-get
      monitoring:
        required: false
