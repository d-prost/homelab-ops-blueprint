---
stack_target_dir: /opt/homelab-ops/stacks/redis-synthetic
stack_compose_dest: docker-compose.yml
stack_expected_services:
  - redis
stack_managed_files:
  - src: compose.yaml
    dest: docker-compose.yml
    mode: "0644"
  - src: defaults.env
    dest: defaults.env
    mode: "0644"
stack_functional_checks:
  - name: redis-ping
    service: redis
    protocol: redis-ping
    port: 6379
operations:
  services:
    redis:
      stateful: true
      persistent_mounts:
        - target: /data
          data_class: application-data
      secrets:
        handling: none
      backup:
        policy: synthetic-rdb
        export:
          format: rdb
          runbook: recovery/README.md
      restore:
        runbook: recovery/README.md
        verification: redis-get
        format: rdb
      rollback:
        schema_sensitive: false
      monitoring:
        required: false
