---
stack_target_dir: /opt/homelab-ops/stacks/nginx
stack_compose_dest: docker-compose.yml
stack_expected_services:
  - nginx
stack_managed_files:
  - src: compose.yaml
    dest: docker-compose.yml
    mode: "0644"
  - src: defaults.env
    dest: defaults.env
    mode: "0644"
stack_functional_checks:
  - name: nginx-http
    service: nginx
    port: 80
    path: /
    status_codes:
      - 200
